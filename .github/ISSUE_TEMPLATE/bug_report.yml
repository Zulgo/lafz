name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't** paste private dictations or attach recordings.
  - type: input
    id: system
    attributes:
      label: Your computer
      description: OS and version, chip and memory
      placeholder: macOS 15, M1, 8 GB  /  Windows 11, Intel i7, 16 GB
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup tab
      description: Which items in Murmur's Setup tab are not ✅?
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The end of `~/Library/Logs/Murmur.log` (Mac) or `murmur.log` in your user folder (Windows).
      render: text
