[project]
name = "murmur"
version = "0.3.0"
description = "Private, free push-to-talk dictation that runs entirely on your computer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "sounddevice",
    "pynput",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "parakeet-mlx>=0.5.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "onnxruntime>=1.31.0",
    "onnx-asr>=0.12.0 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
]

[tool.uv]
python-preference = "only-managed"
