name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]  # macos-14 = Apple Silicon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uvx pyflakes app.py engine.py learning.py system.py webui.py make_icon.py
      - name: Lint (macOS modules)
        if: runner.os == 'macOS'
        run: uvx pyflakes pill.py menubar.py macwindow.py
      - name: Check the interface script
        run: node --check ui/app.js
      - name: Run tests
        run: uv run pytest -q
